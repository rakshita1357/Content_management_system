<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad run order</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<p class="loading" id="loading"><span id="loading-text">Loading the ads...</span></p>
<main class="board" id="board" hidden>
  <header class="head">
    <div>
      <h1>Ad run order</h1>
      <p class="sub" id="sub"></p>
    </div>
    <dl class="stats" id="stats"></dl>
  </header>
  <dl class="facts" id="facts">
    <div class="fact"><dt>Drive folder</dt><dd id="f-folder"></dd></div>
    <div class="fact"><dt>Saved for offline play</dt><dd id="f-saved"></dd></div>
    <div class="fact"><dt>Connection</dt><dd id="f-conn"></dd></div>
    <div class="fact"><dt>Last sync</dt><dd id="f-last"></dd></div>
  </dl>
  <p class="note" id="cache-note"></p>
  <div class="actions">
    <button id="start" class="btn" type="button" hidden>Start playing</button>
    <button id="sync-now" class="btn secondary" type="button">Sync now</button>
    <a id="change-folder" class="btn secondary" href="#">Change Drive folder</a>
    <button id="change-server" class="btn secondary" type="button" hidden>Server address</button>
  </div>
  <table id="table">
    <thead>
      <tr>
        <th class="c-order">#</th><th class="c-ad">Ad</th><th class="c-file">File</th><th class="c-type">Type</th>
        <th class="c-len num">On screen</th><th class="c-size num">Size</th><th class="c-added num">Added</th><th class="c-cache num">Offline</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty" hidden>No ads yet. Put an MP4, JPG or PNG inside a subfolder of the Drive folder and it appears here after the next sync.</p>
  <section class="skipped" id="skipped" hidden>
    <h2>Found in Drive but not playing</h2>
    <ul id="skipped-list"></ul>
  </section>
</main>
<div id="player-root" hidden>
  <div id="stage"></div>
  <button id="exit" type="button" aria-label="Exit player">&times;</button>
</div>
<div class="wifi on" id="wifi"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 18.5a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zM12 12c-2.3 0-4.4.9-6 2.4l1.6 1.7A6.7 6.7 0 0 1 12 14.3c1.8 0 3.4.7 4.4 1.8l1.6-1.7A9.1 9.1 0 0 0 12 12zm0-6.5c-3.8 0-7.2 1.5-9.7 3.9l1.6 1.7A11.4 11.4 0 0 1 12 7.8c3.1 0 5.9 1.2 8.1 3.3l1.6-1.7A13.7 13.7 0 0 0 12 5.5z"/></svg></div>
<div class="mute" id="mute" hidden title="Press OK for sound"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4-2.4-2.4z"/></svg></div>
<script src="config.js"></script>
<script src="cache.js"></script>
<script src="player.js"></script>
</body>
</html>
