<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV ads</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #0f2233; color: #e8eef3; font: 18px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
  form { width: 100%; max-width: 640px; }
  h1 { margin: 0 0 18px; font-size: 32px; letter-spacing: 0.01em; }
  .row { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 13px 14px; border: 2px solid #35526b; border-radius: 8px; background: #fff; color: #14263a; }
  button { font: inherit; font-weight: 600; padding: 13px 26px; border: 0; border-radius: 8px; background: #f5b841; color: #0f2233; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: progress; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #msg { margin: 16px 0 0; padding: 12px 14px; border-radius: 8px; font-size: 16px; }
  #msg.bad { background: #fbeee9; color: #6d2614; }
  #msg.info { background: #1b3650; color: #e8eef3; }
  #msg p { margin: 0; }
  #msg p + p { margin-top: 4px; }
  #current { margin: 14px 0 0; color: #93a8ba; font-size: 15px; }
  #overlay { position: fixed; inset: 0; background: rgba(5, 12, 20, 0.75); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #dialog { max-width: 520px; background: #fff; color: #14263a; border-radius: 12px; padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #dialog h2 { margin: 0 0 10px; font-size: 24px; }
  #dialog p { margin: 0 0 10px; font-size: 16px; }
  #dialog .names { background: #eef3f7; border-radius: 8px; padding: 10px 12px; font-size: 15px; }
  #dialog .buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  #dialog button { padding: 11px 20px; }
  #cancel { background: #e4ebf1; color: #14263a; }
  #confirm { background: #b5472b; color: #fff; }
  @media (max-width: 520px) { .row { flex-direction: column; } }
</style>
</head>
<body>
<form id="form">
  <h1>TV ads</h1>
  <div class="row">
    <input id="link" type="text" placeholder="Paste a Google Drive folder link" autocomplete="off" spellcheck="false" autofocus required aria-label="Google Drive folder link">
    <button id="go" type="submit">Submit</button>
  </div>
  <div id="msg" hidden></div>
  <p id="current" hidden></p>
</form>
<div id="overlay" hidden>
  <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title">Change Drive folder?</h2>
    <p>Your current cached advertisements belong to a different Drive folder. Changing the folder will remove the currently cached advertisements and download advertisements from the new folder.</p>
    <p class="names" id="dlg-names"></p>
    <p>The current ads keep playing until the new ones are ready.</p>
    <div class="buttons">
      <button id="cancel" type="button">Cancel</button>
      <button id="confirm" type="button">Change &amp; Remove</button>
    </div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
function say(kind, lines) {
  const box = $('#msg');
  box.hidden = false;
  box.className = kind;
  box.replaceChildren(...lines.filter(Boolean).map((t) => Object.assign(document.createElement('p'), { textContent: t })));
}
async function post(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || `Something went wrong (HTTP ${res.status}).`), { hint: data.hint, code: data.code });
  return data;
}

// Resolves true (Change & Remove) or false (Cancel).
function confirmChange(check) {
  return new Promise((resolve) => {
    $('#dlg-names').textContent = `Current: ${check.current.folderName || 'current folder'}  →  New: ${check.source.folderName} (${check.summary.totalAds} ad${check.summary.totalAds === 1 ? '' : 's'})`;
    $('#overlay').hidden = false;
    $('#cancel').focus();
    const close = (answer) => {
      $('#overlay').hidden = true;
      document.removeEventListener('keydown', onKey);
      resolve(answer);
    };
    const onKey = (e) => { if (e.key === 'Escape') close(false); };
    document.addEventListener('keydown', onKey);
    $('#cancel').onclick = () => close(false);
    $('#confirm').onclick = () => close(true);
  });
}

async function load(link, replace) {
  const body = await post('/api/source', { link, replace });
  if (body.syncError && !body.unchanged) throw Object.assign(new Error(`The folder was found, but loading the ads failed: ${body.syncError.message}`), { hint: body.syncError.hint });
  if (!body.summary.totalAds) {
    say('info', [`Connected to "${body.source.folderName}", but there are no ads in it yet.`, ...body.warnings, 'Add MP4, JPG or PNG files inside subfolders of that folder, then submit the link again.']);
    return false;
  }
  return true;
}

// The folder that is already connected (and whether it has ads), so its link can open the TV page at once.
let connected = null;

// Same shapes parseFolderInput accepts on the server: .../folders/<ID>, ...?id=<ID>, or the bare ID.
function folderIdOf(text) {
  const t = String(text || '').trim();
  if (/^[A-Za-z0-9_-]{10,}$/.test(t)) return t;
  const m = t.match(/\/folders\/([A-Za-z0-9_-]{10,})/) || t.match(/[?&]id=([A-Za-z0-9_-]{10,})/);
  return m ? m[1] : null;
}

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#go');
  const link = $('#link').value;
  // Same folder as the one already playing: show the ad list straight away. The server refreshes it in the background.
  if (connected && folderIdOf(link) === connected) {
    btn.disabled = true;
    try { fetch('/api/source', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ link, replace: false }) }).catch(() => {}); } catch (err) { /* the TV page still opens */ }
    window.location.href = '/tv/';
    return;
  }
  btn.disabled = true;
  say('info', ['Checking the folder…']);
  try {
    // 1. Check first: nothing is changed or removed until the new folder is valid and (if needed) confirmed.
    const check = await post('/api/source/check', { link });
    if (check.requiresConfirm && !(await confirmChange(check))) {
      say('info', ['Nothing was changed. The current folder and its saved ads are kept.']);
      btn.disabled = false;
      return;
    }
    say('info', [check.same ? 'This folder is already connected. Checking for changes…' : 'Loading the ads…']);
    if (await load(link, check.requiresConfirm)) window.location.href = '/tv/';
    else btn.disabled = false;
  } catch (err) {
    say('bad', [err.message, err.hint && `Fix: ${err.hint}`]);
    btn.disabled = false;
  }
});

Promise.all([fetch('/api/source').then((r) => r.json()), fetch('/api/health').then((r) => r.json()).catch(() => ({}))]).then(([{ source }, health]) => {
  if (!source) return;
  if (health.ads > 0) connected = source.folderId;
  $('#current').hidden = false;
  $('#current').textContent = `Current folder: ${source.folderName || 'connected'}`;
}).catch(() => {});
</script>
</body>
</html>
