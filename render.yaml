# Render Blueprint for the TV ads backend. In Render: New > Blueprint > pick this repository.
# Secrets (sync: false) are asked for in the Render dashboard; they are never stored in the repository.
services:
  - type: web
    name: tv-ads
    runtime: node
    # "starter" or higher, because it needs a disk (below) and must not go to sleep. The free plan sleeps and forgets its
    # data/ folder (set DRIVE_FOLDER_ID so a restarted free service reconnects to your folder by itself).
    plan: starter
    buildCommand: cd tv-ad-backend && npm ci --omit=dev
    startCommand: node tv-ad-backend/src/server.js
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: LOG_FORMAT
        value: json
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      # Optional: keep the chosen folder, ad list and screens in a database (for example free Neon) instead of the disk.
      - key: DATABASE_URL
        sync: false
      # Optional: a service account key instead of the OAuth values above (it never expires).
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
    disk:
      name: tvads-data
      mountPath: /var/data
      sizeGB: 1
